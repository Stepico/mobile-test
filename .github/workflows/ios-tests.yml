name: iOS App Tests

on:
  # Ручний запуск workflow через GitHub UI
  workflow_dispatch:
    inputs:
      ios_version:
        description: 'iOS версія для тестування (за замовчуванням 18.5)'
        required: false
        default: '18.5'
        type: string
      device_name:
        description: 'Назва пристрою (за замовчуванням iPhone 16 Pro)'
        required: false
        default: 'iPhone 16 Pro'
        type: string
      ios_app_tag:
        description: 'iOS app тег з github (за замовчуванням 4.20.6)'
        required: false
        default: '4.20.6'
        type: string
  
  # Автоматичний запуск при push до main (тільки якщо змінились iOS тести або конфігурація)
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ios-tests.yml'
      - 'test/specs/iOS/**'
      - 'wdio.ios.conf.js'
      - 'scripts/ios/**'
      - 'helpers/helper-iOS.js'
  
  # Автоматичний запуск при PR
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ios-tests.yml'
      - 'test/specs/iOS/**'
      - 'wdio.ios.conf.js'
      - 'scripts/ios/**'
      - 'helpers/helper-iOS.js'

jobs:
  ios-tests:
    name: iOS Tests (${{ inputs.device_name || 'iPhone 16 Pro' }} - iOS ${{ inputs.ios_version || '18.5' }})
    runs-on: macos-latest
    timeout-minutes: 60  # Збільшено до 60 хв для складних тестів з BankID

    env:
      # Конфігурація iOS app
      IOS_BUNDLE_ID: ua.gov.diia.opensource.app
      IOS_DEVICE_NAME: ${{ inputs.device_name || 'iPhone 16 Pro' }}
      IOS_PLATFORM_VERSION: ${{ inputs.ios_version || '18.5' }}
      IOS_APP_TAG: ${{ inputs.ios_app_tag || '4.20.6' }}
      
      # CI environment
      CI: true
      NODE_ENV: test
      
      # Appium конфігурація
      APPIUM_LOG_LEVEL: info

    steps:
      # ========================================
      # КРОК 1: Підготовка середовища
      # ========================================
      
      - name: Checkout тестового репозиторію
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone для швидкості

      - name: Налаштування Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'  # Кешування npm пакетів

      - name: Вибір версії Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          echo "Xcode шлях встановлено"

      - name: Інформація про Xcode та доступні симулятори
        run: |
          echo "=== Xcode версія ==="
          xcodebuild -version
          echo ""
          echo "=== Доступні iOS симулятори ==="
          xcrun simctl list devices available | grep -i "iphone" | head -15
          echo ""
          echo "=== Доступні iOS runtimes ==="
          xcrun simctl list runtimes available | grep -i "ios"

      # ========================================
      # КРОК 2: Встановлення залежностей
      # ========================================

      - name: Встановлення npm залежностей
        run: |
          echo "Встановлюємо npm пакети..."
          # Очищаємо npm cache
          npm cache clean --force
          # Видаляємо старий package-lock якщо є проблеми з версіями
          rm -f package-lock.json
          npm install
          echo "npm залежності встановлено"

      - name: Кеш Appium
        id: cache-appium
        uses: actions/cache@v4
        with:
          path: |
            ~/.appium
            ~/.npm/_npx
          key: ${{ runner.os }}-appium-${{ hashFiles('scripts/ios/ensure-appium.sh') }}
          restore-keys: |
            ${{ runner.os }}-appium-

      - name: Встановлення Appium + XCUITest driver
        run: |
          echo "Встановлюємо Appium та XCUITest driver..."
          bash scripts/ios/ensure-appium.sh
          echo ""
          echo "Appium готовий до роботи"

      # ========================================
      # КРОК 3: Збірка iOS додатку
      # ========================================

      - name: Checkout iOS source репозиторію
        uses: actions/checkout@v4
        with:
          repository: diia-open-source/ios-diia
          ref: ${{ env.IOS_APP_TAG }}  # Використовуємо стабільний тег (за замовчуванням 4.20.6)
          path: ios-diia
          fetch-depth: 1

      - name: Виправлення конфігурації та коду
        run: |
          cd ios-diia
          
          echo "=== Патчимо API URL: api2oss → api2s ==="
          echo ""
          
          # КРОК 1: Патчимо конфігураційні файли
          echo "КРОК 1: Патчимо конфігураційні файли (.xcconfig, .plist, .json, .xml)..."
          find . \( -name "*.xcconfig" -o -name "*.plist" -o -name "*.json" -o -name "*.xml" \) \
            -type f \
            -not -path "*/\.*" \
            -not -path "*/Pods/*" \
            -not -path "*/build/*" \
            -not -path "*/DerivedData/*" \
            -exec sed -i '' 's/api2oss\.diia\.gov\.ua/api2s.diia.gov.ua/g' {} +
          echo "✅ Конфігураційні файли пропатчено"
          
          # КРОК 2: Патчимо Swift код
          echo ""
          echo "КРОК 2: Патчимо Swift код (.swift файли)..."
          find . -name "*.swift" \
            -type f \
            -not -path "*/\.*" \
            -not -path "*/Pods/*" \
            -not -path "*/build/*" \
            -not -path "*/DerivedData/*" \
            -exec sed -i '' 's/api2oss\.diia\.gov\.ua/api2s.diia.gov.ua/g' {} + \
            -exec sed -i '' 's/"api2oss"/"api2s"/g' {} + \
            -exec sed -i '' "s/'api2oss'/'api2s'/g" {} +
          echo "✅ Swift код пропатчено"
          
          # КРОК 3: Патчимо Objective-C код
          echo ""
          echo "КРОК 3: Патчимо Objective-C код (.m, .h файли)..."
          find . \( -name "*.m" -o -name "*.h" \) \
            -type f \
            -not -path "*/\.*" \
            -not -path "*/Pods/*" \
            -not -path "*/build/*" \
            -not -path "*/DerivedData/*" \
            -exec sed -i '' 's/api2oss\.diia\.gov\.ua/api2s.diia.gov.ua/g' {} + \
            -exec sed -i '' 's/@"api2oss"/@"api2s"/g' {} +
          echo "✅ Objective-C код пропатчено"
          
          echo ""
          echo "API URL замінено в всіх знайдених файлах"
          
          # Верифікація: перевіряємо чи залишились старі URL
          echo ""
          echo "=== Перевірка: шукаємо api2oss (старий URL) ==="
          OLD_URL_COUNT=$(grep -r "api2oss\.diia\.gov\.ua" . --include="*.xcconfig" --include="*.swift" --include="*.plist" 2>/dev/null | wc -l || echo "0")
          if [ "$OLD_URL_COUNT" -gt 0 ]; then
            echo "⚠️  УВАГА: Знайдено $OLD_URL_COUNT входжень старого URL:"
            grep -r "api2oss\.diia\.gov\.ua" . --include="*.xcconfig" --include="*.swift" --include="*.plist" 2>/dev/null || true
          else
            echo "✅ Старих URL не знайдено - патч успішний"
          fi
          
          # Показуємо нові URL для підтвердження
          echo ""
          echo "=== Перевірка: шукаємо api2s (новий URL) ==="
          NEW_URL_COUNT=$(grep -r "api2s\.diia\.gov\.ua" . --include="*.xcconfig" --include="*.swift" --include="*.plist" 2>/dev/null | wc -l || echo "0")
          echo "✅ Знайдено $NEW_URL_COUNT входжень нового URL"
          if [ "$NEW_URL_COUNT" -gt 0 ]; then
            echo "Приклади:"
            grep -r "api2s\.diia\.gov\.ua" . --include="*.xcconfig" --include="*.swift" --include="*.plist" 2>/dev/null | head -5 || true
          fi
          
          echo ""
          echo "=== Патч AppConfigurator.swift ==="
          # Виправлення AppConfigurator.swift (якщо є помилка imageNameProvider)
          if [ -f "DiiaOpenSource/AppConfigurator.swift" ]; then
            # Видаляємо параметр imageNameProvider якщо він є
            sed -i '' 's/, imageNameProvider: [^)]*//g' DiiaOpenSource/AppConfigurator.swift
            sed -i '' 's/imageNameProvider: [^,)]*,\?//g' DiiaOpenSource/AppConfigurator.swift
            echo "✅ AppConfigurator.swift пропатчено"
          else
            echo "⚠️  AppConfigurator.swift не знайдено"
          fi
          
          echo ""
          echo "=== КРОК 4: Re-install Pods з пропатченими конфігами ==="
          # Pods може містити хардкоджений api2oss, переінсталюємо після патчу
          if [ -f "Podfile" ]; then
            echo "Знайдено Podfile, переінсталюємо Pods..."
            # Встановлюємо CocoaPods якщо потрібно
            if ! command -v pod &> /dev/null; then
              echo "Встановлюємо CocoaPods..."
              sudo gem install cocoapods -v 1.15.2 --no-document
            fi
            
            # Видаляємо старі Pods
            rm -rf Pods Podfile.lock
            
            # Встановлюємо Pods з нуля
            pod install --repo-update || pod install
            echo "✅ Pods переінстальовано"
            
            echo ""
            echo "=== КРОК 5: Патчимо встановлені Pods ==="
            echo "КРИТИЧНО: Pods може містити хардкоджений api2oss - патчимо!"
            
            if [ -d "Pods" ]; then
              # Патчимо всі файли в Pods директорії
              echo "Шукаємо та патчимо api2oss в Pods..."
              
              # Показуємо скільки знайдено перед патчем
              PODS_OLD_COUNT=$(grep -r "api2oss" Pods/ --include="*.swift" --include="*.m" --include="*.h" --include="*.strings" --include="*.plist" 2>/dev/null | wc -l | tr -d ' ')
              echo "Знайдено $PODS_OLD_COUNT входжень api2oss в Pods"
              
              # Патчимо
              find Pods/ \( -name "*.swift" -o -name "*.m" -o -name "*.h" -o -name "*.strings" -o -name "*.plist" -o -name "*.json" \) \
                -type f \
                -exec sed -i '' 's/api2oss\.diia\.gov\.ua/api2s.diia.gov.ua/g' {} + \
                -exec sed -i '' 's/"api2oss"/"api2s"/g' {} + \
                -exec sed -i '' "s/'api2oss'/'api2s'/g" {} + \
                -exec sed -i '' 's/@"api2oss"/@"api2s"/g' {} + 2>/dev/null || true
              
              # Перевірка після патчу
              PODS_OLD_AFTER=$(grep -r "api2oss" Pods/ --include="*.swift" --include="*.m" --include="*.h" --include="*.strings" --include="*.plist" 2>/dev/null | wc -l | tr -d ' ')
              echo "Після патчу залишилось: $PODS_OLD_AFTER входжень api2oss"
              
                if [ "$PODS_OLD_AFTER" -gt 0 ]; then
                echo "❌ КРИТИЧНА ПОМИЛКА: Патч Pods не повністю спрацював!"
                echo ""
                echo "В Pods все ще є api2oss:"
                grep -r "api2oss" Pods/ --include="*.swift" --include="*.m" --include="*.h" 2>/dev/null | head -10 || true
                echo ""
                echo "Спроба 2: Видаляємо Pods та переінсталюємо..."
                rm -rf Pods Podfile.lock
                pod install --repo-update || pod install
                
                echo "Повторний патч Pods..."
                find Pods/ \( -name "*.swift" -o -name "*.m" -o -name "*.h" -o -name "*.strings" -o -name "*.plist" -o -name "*.json" \) \
                  -type f \
                  -exec sed -i '' 's/api2oss\.diia\.gov\.ua/api2s.diia.gov.ua/g' {} + \
                  -exec sed -i '' 's/"api2oss"/"api2s"/g' {} + \
                  -exec sed -i '' "s/'api2oss'/'api2s'/g" {} + \
                  -exec sed -i '' 's/@"api2oss"/@"api2s"/g' {} + 2>/dev/null || true
                
                # Фінальна перевірка
                PODS_OLD_FINAL=$(grep -r "api2oss" Pods/ --include="*.swift" --include="*.m" --include="*.h" --include="*.strings" --include="*.plist" 2>/dev/null | wc -l | tr -d ' ')
                echo "Після повторного патчу залишилось: $PODS_OLD_FINAL входжень"
                
                if [ "$PODS_OLD_FINAL" -gt 0 ]; then
                  echo ""
                  echo "❌ FAIL: Не вдалося пропатчити Pods навіть після переінсталяції!"
                  echo ""
                  echo "Можливі причини:"
                  echo "1. Pods містить api2oss в бінарних файлах"
                  echo "2. Pods містить api2oss в файлах які ми не патчимо"
                  echo "3. sed не працює для деяких файлів"
                  echo ""
                  echo "Залишилось api2oss в:"
                  grep -r "api2oss" Pods/ 2>/dev/null | head -10 || true
                  echo ""
                  echo "Зупиняємо workflow - неможливо зібрати app з правильним API"
                  exit 1
                fi
                
                echo "✅ Pods успішно пропатчено після переінсталяції"
              else
                echo "✅ Pods повністю пропатчено - api2oss відсутній"
              fi
            fi
          else
            echo "ℹ️  Podfile не знайдено, пропускаємо"
          fi

      - name: Очищення build кешу для чистої збірки
        run: |
          echo "Очищаємо Xcode build кеш для гарантії що app зберется з новим API..."
          cd ios-diia
          
          # Очищаємо DerivedData (там може бути закешений старий конфіг)
          # ВАЖЛИВО: Тільда (~) НЕ розширюється в лапках, використовуємо $HOME
          DERIVED_DATA="$HOME/Library/Developer/Xcode/DerivedData"
          if [ -d "$DERIVED_DATA" ]; then
            echo "Видаляємо $DERIVED_DATA"
            rm -rf "$DERIVED_DATA"
            echo "✅ DerivedData очищено"
          else
            echo "ℹ️  DerivedData не існує, пропускаємо"
          fi
          
          # Очищаємо build директорію проекту
          if [ -d "build" ]; then
            rm -rf build
            echo "✅ Build директорія очищена"
          else
            echo "ℹ️  Build директорія не існує, пропускаємо"
          fi
          
          # Перевіряємо Pods перед збіркою
          if [ -d "Pods" ]; then
            # Фінальна верифікація що Pods не містять api2oss
            PODS_CHECK=$(grep -r "api2oss" Pods/ 2>/dev/null | wc -l | tr -d ' ')
            if [ "$PODS_CHECK" -gt 0 ]; then
              echo "❌ КРИТИЧНА ПОМИЛКА: Pods все ще містять api2oss перед збіркою!"
              echo "Це не повинно статись - патч має бути виконаний в попередньому кроці"
              echo ""
              echo "Видаляємо Pods та зупиняємо workflow..."
              rm -rf Pods Podfile.lock
              exit 1
            else
              echo "✅ Pods перевірено - api2oss відсутній, залишаємо для збірки"
            fi
          else
            echo "⚠️  УВАГА: Pods не існує перед збіркою - це може спричинити помилку build"
            echo "Можливо попередній крок failed. Спробуємо встановити Pods..."
            if [ -f "Podfile" ]; then
              pod install || echo "Failed to install Pods"
            fi
          fi
          
          # Xcode clean
          echo "Виконуємо xcodebuild clean..."
          xcodebuild clean -workspace DiiaOpenSource.xcworkspace -scheme DiiaOpenSource -configuration Debug 2>/dev/null || echo "Clean виконано (деякі помилки ігноруємо)"
          
          echo ""
          echo "✅ Build кеш повністю очищено - app зберется з нуля з правильним API URL"

      - name: Збірка iOS додатку для Simulator
        id: build-app
        run: |
          echo "Починаємо збірку iOS додатку..."
          echo "ВАЖЛИВО: Збірка відбувається ПІСЛЯ патчу API URL (api2oss → api2s)"
          bash scripts/ios/build-app.sh
          echo "Збірка завершена"
        env:
          IOS_SOURCE_DIR: ./ios-diia
        continue-on-error: false  # Якщо збірка падає - зупиняємо workflow

      - name: Перевірка app bundle
        id: verify-app
        run: |
          APP_PATH="./ios-app/DiiaOpenSource.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle не знайдено в $APP_PATH"
            echo ""
            echo "=== Діагностика ==="
            echo "Структура ios-app директорії:"
            ls -la ./ios-app/ 2>/dev/null || echo "Директорія ios-app не існує"
            echo ""
            echo "Останні 100 рядків build логу:"
            if [ -f "./ios-build/xcodebuild.log" ]; then
              tail -100 ./ios-build/xcodebuild.log
            else
              echo "Build лог не знайдено"
            fi
            exit 1
          fi
          
          echo "App bundle знайдено: $APP_PATH"
          echo ""
          echo "=== Інформація про app bundle ==="
          ls -lh "$APP_PATH"
          echo ""
          
          # Отримуємо Bundle ID
          BUNDLE_ID=$(defaults read "$APP_PATH/Info.plist" CFBundleIdentifier 2>/dev/null || echo "невідомо")
          echo "Bundle ID: $BUNDLE_ID"
          
          # Отримуємо розмір
          APP_SIZE=$(du -sh "$APP_PATH" | cut -f1)
          echo "Розмір: $APP_SIZE"
          
          echo ""
          echo "=== ✅ КРИТИЧНО: Перевірка API URL в зібраній app ==="
          echo "Шукаємо API URL в Info.plist та інших конфігах..."
          
          # Перевіряємо Info.plist
          if [ -f "$APP_PATH/Info.plist" ]; then
            echo ""
            echo "📄 Info.plist:"
            # Конвертуємо в XML для читабельності
            plutil -convert xml1 "$APP_PATH/Info.plist" -o /tmp/Info.plist.xml
            
            # Шукаємо API URLs
            if grep -i "api.*diia.*gov" /tmp/Info.plist.xml; then
              echo "✅ Знайдено API URL в Info.plist"
            else
              echo "⚠️  API URL не знайдено в Info.plist (можливо нормально)"
            fi
            
            # Перевіряємо чи є старий URL
            if grep -i "api2oss\.diia\.gov\.ua" /tmp/Info.plist.xml; then
              echo "❌ ПОМИЛКА: Знайдено СТАРИЙ URL api2oss в Info.plist!"
              echo "Патч НЕ СПРАЦЮВАВ для Info.plist"
            fi
            
            # Перевіряємо чи є новий URL
            if grep -i "api2s\.diia\.gov\.ua" /tmp/Info.plist.xml; then
              echo "✅ Знайдено НОВИЙ URL api2s в Info.plist"
            fi
          fi
          
          # Шукаємо в binary (strings command)
          echo ""
          echo "🔍 Шукаємо API URL в app binary..."
          APP_BINARY="$APP_PATH/DiiaOpenSource"
          
          HAS_OLD_URL=false
          HAS_NEW_URL=false
          
          if [ -f "$APP_BINARY" ]; then
            echo "Старий URL (api2oss):"
            if strings "$APP_BINARY" | grep -i "api2oss\.diia\.gov\.ua" | head -3; then
              echo "❌ КРИТИЧНА ПОМИЛКА: СТАРИЙ URL знайдено в binary!"
              echo "Це означає що app зібрався з неправильним конфігом"
              HAS_OLD_URL=true
            else
              echo "✅ Старий URL НЕ знайдено в binary"
            fi
            
            echo ""
            echo "Новий URL (api2s):"
            if strings "$APP_BINARY" | grep -i "api2s\.diia\.gov\.ua" | head -3; then
              echo "✅ Новий URL знайдено в binary - патч спрацював!"
              HAS_NEW_URL=true
            else
              echo "❌ КРИТИЧНА ПОМИЛКА: НОВИЙ URL НЕ знайдено в binary!"
              echo "Це означає що патч НЕ СПРАЦЮВАВ або app зібрався з кешу"
            fi
            
            echo ""
            echo "=== ФІНАЛЬНА ПЕРЕВІРКА ==="
            if [ "$HAS_OLD_URL" = true ]; then
              echo "❌ FAIL: Старий URL (api2oss) все ще в binary"
              echo ""
              echo "Патч НЕ ПОВНІСТЮ спрацював. Можливі причини:"
              echo "1. Pods містять хардкоджений api2oss"
              echo "2. Якийсь згенерований файл має старий URL"
              echo "3. Build кеш не повністю очищено"
              echo ""
              echo "Зупиняємо workflow - app не можна тестувати з неправильним API"
              exit 1
            fi
            
            if [ "$HAS_NEW_URL" = false ]; then
              echo "❌ FAIL: Новий URL (api2s) НЕ знайдено в binary"
              echo ""
              echo "Патч НЕ спрацював взагалі. Можливі причини:"
              echo "1. Патч застосувався після збірки"
              echo "2. Build скрипт ігнорує пропатчені файли"
              echo "3. API URL генерується динамічно"
              echo ""
              echo "Зупиняємо workflow - app не можна тестувати з неправильним API"
              exit 1
            fi
            
            echo "✅ SUCCESS: Тільки новий URL (api2s) в binary, старий відсутній"
          fi
          
          echo ""
          echo "=== Результат перевірки ==="
          # Зберігаємо для job summary
          echo "app_size=$APP_SIZE" >> $GITHUB_OUTPUT
          echo "bundle_id=$BUNDLE_ID" >> $GITHUB_OUTPUT

      # ========================================
      # КРОК 4: Запуск iOS Simulator
      # ========================================

      - name: Запуск iOS Simulator
        id: boot-sim
        run: |
          echo "Запускаємо iOS Simulator..."
          bash scripts/ios/boot-sim.sh
          echo "Simulator запущено"
        env:
          OPEN_SIMULATOR: false  # Не відкриваємо GUI в CI

      - name: Перевірка стану Simulator
        run: |
          echo "Перевіряємо чи Simulator запущено..."
          BOOTED_DEVICE=$(xcrun simctl list devices | grep "Booted" || echo "")
          
          if [ -z "$BOOTED_DEVICE" ]; then
            echo "Simulator не запущено або не в статусі Booted"
            echo ""
            echo "=== Доступні пристрої ==="
            xcrun simctl list devices
            exit 1
          fi
          
          echo "Simulator запущено:"
          echo "$BOOTED_DEVICE"

      - name: Попереднє встановлення app на Simulator
        run: |
          echo "Встановлюємо app на Simulator заздалегідь для швидшого запуску тестів..."
          UDID="${{ steps.boot-sim.outputs.udid }}"
          APP_PATH="./ios-app/DiiaOpenSource.app"
          
          # Встановлюємо app
          xcrun simctl install "$UDID" "$APP_PATH"
          echo "App встановлено на Simulator"
          
          # Даємо час симулятору обробити встановлення
          sleep 5
          
          # Перевіряємо що app встановлено
          if xcrun simctl listapps "$UDID" | grep -q "ua.gov.diia.opensource.app"; then
            echo "✅ App успішно встановлено та підтверджено"
          else
            echo "⚠️  App може бути не встановлено правильно"
          fi

      # ========================================
      # КРОК 5: Запуск тестів
      # ========================================

      - name: Запуск iOS E2E тестів
        id: run-tests
        run: |
          echo "Запускаємо iOS тести..."
          echo ""
          echo "=== Конфігурація ==="
          echo "App path: ${IOS_APP_PATH}"
          echo "Device UDID: ${IOS_DEVICE_UDID}"
          echo "Device name: ${IOS_DEVICE_NAME}"
          echo "Platform version: ${IOS_PLATFORM_VERSION}"
          echo ""
          echo "=== Перевірка app перед запуском ==="
          ls -lh "${IOS_APP_PATH}"
          echo ""
          echo "=== Запуск тестів ==="
          npm run test:ios:ci
        env:
          IOS_APP_PATH: ./ios-app/DiiaOpenSource.app
          IOS_DEVICE_UDID: ${{ steps.boot-sim.outputs.udid }}
        timeout-minutes: 60  # Збільшено timeout для великого app

      # ========================================
      # КРОК 6: Збір артефактів при помилках
      # ========================================

      - name: Завантаження скріншотів (при помилці)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots-${{ github.run_number }}
          path: artifacts/screenshots/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Завантаження page source (при помилці)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-pagesources-${{ github.run_number }}
          path: artifacts/pagesources/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Завантаження build логів (при помилці)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ github.run_number }}
          path: ios-build/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Завантаження Appium логів (при помилці)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-appium-logs-${{ github.run_number }}
          path: |
            appium.log
            appium*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Завантаження WebDriver логів (при помилці)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-wdio-logs-${{ github.run_number }}
          path: |
            wdio-*.log
          retention-days: 7
          if-no-files-found: ignore

      # ========================================
      # КРОК 7: Job Summary
      # ========================================

      - name: Створення job summary
        if: always()
        run: |
          echo "## iOS Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Конфігурація
          echo "### Конфігурація" >> $GITHUB_STEP_SUMMARY
          echo "- **Пристрій**: ${{ env.IOS_DEVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **iOS версія**: ${{ env.IOS_PLATFORM_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle ID**: ${{ steps.verify-app.outputs.bundle_id || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App розмір**: ${{ steps.verify-app.outputs.app_size || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Статус тестів
          echo "### Результати тестів" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.run-tests.outcome }}" == "success" ]; then
            echo "**Всі тести пройшли успішно**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Тести завершились з помилками**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Перегляньте артефакти для детальної інформації:" >> $GITHUB_STEP_SUMMARY
            echo "- Скріншоти помилок" >> $GITHUB_STEP_SUMMARY
            echo "- Page source файли" >> $GITHUB_STEP_SUMMARY
            echo "- Build та Appium логи" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Xcode інформація
          echo "### Xcode Environment" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          xcodebuild -version >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY