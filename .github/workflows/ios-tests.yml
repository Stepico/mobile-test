name: iOS App Tests

# ============================================================================
# Concurrency: Запобігає паралельним runs для того ж PR/branch
# ============================================================================
concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

# ============================================================================
# Triggers
# ============================================================================
on:
  workflow_dispatch:
    inputs:
      ios_version:
        description: 'iOS версія (default: 18.5)'
        required: false
        default: '18.5'
        type: string
      device_name:
        description: 'Device name (default: iPhone 16 Pro)'
        required: false
        default: 'iPhone 16 Pro'
        type: string
      ios_app_tag:
        description: 'iOS app git tag (default: 4.20.6)'
        required: false
        default: '4.20.6'
        type: string
  
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-tests*.yml'
      - 'test/specs/iOS/**'
      - 'wdio.ios.conf.js'
      - 'scripts/ios/**'
      - 'helpers/helper-iOS.js'
  
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ios-tests*.yml'
      - 'test/specs/iOS/**'
      - 'wdio.ios.conf.js'
      - 'scripts/ios/**'
      - 'helpers/helper-iOS.js'

# ============================================================================
# Job
# ============================================================================
jobs:
  ios-tests:
    name: iOS Tests (${{ inputs.device_name || 'iPhone 16 Pro' }} - iOS ${{ inputs.ios_version || '18.5' }})
    runs-on: macos-latest
    timeout-minutes: 60

    # Нормалізовані env variables
    env:
      IOS_BUNDLE_ID: ua.gov.diia.opensource.app
      IOS_DEVICE_NAME: ${{ inputs.device_name || 'iPhone 16 Pro' }}
      IOS_PLATFORM_VERSION: ${{ inputs.ios_version || '18.5' }}
      IOS_APP_TAG: ${{ inputs.ios_app_tag || '4.20.6' }}
      CI: true
      NODE_ENV: test
      APPIUM_LOG_LEVEL: info

    steps:
      # ======================================================================
      # КРОК 1: Підготовка середовища
      # ======================================================================
      
      - name: Checkout тестового репо
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ======================================================================
      # Xcode Selection: Детермінований вибір
      # ======================================================================
      
      - name: Select Xcode version
        run: |
          echo "=== Доступні Xcode версії ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "Тільки default Xcode"
          echo ""
          
          # Пріоритет: Xcode_16.4 > Xcode_16 > Xcode.app
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            XCODE_PATH="/Applications/Xcode_16.4.app"
          elif [ -d "/Applications/Xcode_16.app" ]; then
            XCODE_PATH="/Applications/Xcode_16.app"
          else
            XCODE_PATH="/Applications/Xcode.app"
          fi
          
          echo "Вибрано: $XCODE_PATH"
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          
          echo "=== Xcode version ==="
          xcodebuild -version
          
          echo "=== Доступні iOS runtimes ==="
          xcrun simctl list runtimes available | grep -i "ios" || echo "⚠️  No iOS runtimes found"
          
          echo "=== Доступні iPhone simulators (top 10) ==="
          xcrun simctl list devices available | grep -i "iphone" | head -10 || echo "⚠️  No iPhone simulators found"

      # ======================================================================
      # КРОК 2: Встановлення залежностей (детермінований)
      # ======================================================================

      - name: Install npm dependencies (npm ci)
        run: |
          echo "Installing npm dependencies using npm ci (deterministic)..."
          
          # Перевірка package-lock.json
          if [ ! -f "package-lock.json" ]; then
            echo "❌ package-lock.json not found!"
            echo "Generating lockfile with npm install..."
            npm install
            echo ""
            echo "⚠️  IMPORTANT: Commit package-lock.json to repository"
            exit 1
          fi
          
          npm ci
          echo "✅ npm dependencies installed"

      # ======================================================================
      # Appium: Cache + Install
      # ======================================================================

      - name: Cache Appium
        id: cache-appium
        uses: actions/cache@v4
        with:
          path: |
            ~/.appium
            ~/.npm/_npx
          key: ${{ runner.os }}-appium-2.11.5-xcuitest-7.26.2
          restore-keys: |
            ${{ runner.os }}-appium-

      - name: Install Appium + XCUITest driver
        run: bash scripts/ios/ensure-appium.sh

      # ======================================================================
      # КРОК 3: Збірка iOS app
      # ======================================================================

      - name: Checkout iOS source (diia-open-source/ios-diia)
        uses: actions/checkout@v4
        with:
          repository: diia-open-source/ios-diia
          ref: ${{ env.IOS_APP_TAG }}
          path: ios-diia
          fetch-depth: 1

      # ======================================================================
      # SPM Cache: Кешуємо Swift Package Manager dependencies
      # ======================================================================
      
      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ios-build/DerivedData/SourcePackages
            ios-diia/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('ios-diia/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # ======================================================================
      # API Patch: Мінімальний, через один скрипт
      # ======================================================================

      - name: Patch API host (api2oss → api2s)
        run: |
          echo "=== Патч API Host ==="
          bash scripts/ios/patch-api-host.sh ios-diia
          
          # Перевірка результату
          if [ $? -ne 0 ]; then
            echo "❌ API patch failed"
            exit 1
          fi
          
          echo "✅ API host патч завершено"

      # ======================================================================
      # Build: З ізольованим DerivedData
      # ======================================================================

      - name: Build iOS app for Simulator
        id: build-app
        run: bash scripts/ios/build-app.sh
        env:
          IOS_SOURCE_DIR: ./ios-diia
        continue-on-error: false

      # ======================================================================
      # Verify: Binary check (критично)
      # ======================================================================

      - name: Verify app binary (API URL check)
        id: verify-app
        run: |
          APP_PATH="./ios-app/DiiaOpenSource.app"
          APP_BINARY="$APP_PATH/DiiaOpenSource"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ App bundle not found at $APP_PATH"
            exit 1
          fi
          
          echo "✅ App bundle exists: $APP_PATH"
          
          # Bundle ID
          BUNDLE_ID=$(defaults read "$APP_PATH/Info.plist" CFBundleIdentifier 2>/dev/null || echo "unknown")
          echo "Bundle ID: $BUNDLE_ID"
          
          # Size
          APP_SIZE=$(du -sh "$APP_PATH" | cut -f1)
          echo "Size: $APP_SIZE"
          
          # КРИТИЧНА ПЕРЕВІРКА: Binary має містити api2s і НЕ api2oss
          echo ""
          echo "=== CRITICAL: API URL in binary ==="
          
          HAS_OLD_URL=false
          HAS_NEW_URL=false
          
          if [ -f "$APP_BINARY" ]; then
            # Check for old URL
            if strings "$APP_BINARY" | grep -qi "api2oss\.diia\.gov\.ua"; then
              echo "❌ FAIL: OLD URL (api2oss) found in binary!"
              HAS_OLD_URL=true
            else
              echo "✅ Old URL (api2oss) NOT found"
            fi
            
            # Check for new URL
            if strings "$APP_BINARY" | grep -qi "api2s\.diia\.gov\.ua"; then
              echo "✅ New URL (api2s) found in binary"
              HAS_NEW_URL=true
            else
              echo "❌ FAIL: NEW URL (api2s) NOT found in binary!"
            fi
            
            # Final verdict
            if [ "$HAS_OLD_URL" = true ]; then
              echo ""
              echo "❌ CRITICAL FAIL: App built with wrong API endpoint (api2oss)"
              echo "Cannot proceed with tests - API calls will fail"
              exit 1
            fi
            
            if [ "$HAS_NEW_URL" = false ]; then
              echo ""
              echo "❌ CRITICAL FAIL: Patch did not apply (api2s not found)"
              echo "Cannot proceed with tests - API calls will fail"
              exit 1
            fi
            
            echo ""
            echo "✅ SUCCESS: App binary contains correct API endpoint (api2s only)"
          else
            echo "⚠️  Binary file not found, skipping binary check"
          fi
          
          # Output для job summary
          echo "app_size=$APP_SIZE" >> $GITHUB_OUTPUT
          echo "bundle_id=$BUNDLE_ID" >> $GITHUB_OUTPUT

      # ======================================================================
      # КРОК 4: Simulator
      # ======================================================================

      - name: Boot iOS Simulator
        id: boot-sim
        run: bash scripts/ios/boot-sim.sh
        env:
          OPEN_SIMULATOR: false

      - name: Verify Simulator status
        run: |
          echo "Checking Simulator status..."
          BOOTED=$(xcrun simctl list devices | grep "Booted" || true)
          
          if [ -z "$BOOTED" ]; then
            echo "❌ No Booted simulator found"
            echo "Available devices:"
            xcrun simctl list devices || true
            exit 1
          fi
          
          echo "✅ Simulator booted:"
          echo "$BOOTED"

      - name: Install app on Simulator (with retries)
        run: |
          UDID="${{ steps.boot-sim.outputs.udid }}"
          APP_PATH="./ios-app/DiiaOpenSource.app"
          
          echo "Installing app on Simulator (UDID: $UDID)..."
          
          # Retry logic: 3 attempts with 2s sleep between
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if xcrun simctl install "$UDID" "$APP_PATH" 2>/dev/null; then
              echo "✅ App installed successfully"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⚠️  Install failed (attempt $RETRY_COUNT/$MAX_RETRIES), retrying in 2s..."
                sleep 2
              else
                echo "❌ App install failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done
          
          # Verify installation
          sleep 3
          if xcrun simctl listapps "$UDID" | grep -q "${{ env.IOS_BUNDLE_ID }}"; then
            echo "✅ App verified in simulator app list"
          else
            echo "⚠️  App not visible in listapps (may still work)"
          fi

      # ======================================================================
      # КРОК 5: Тести
      # ======================================================================

      - name: Run iOS E2E tests
        id: run-tests
        run: |
          echo "=== Running iOS E2E tests ==="
          echo "App: ${IOS_APP_PATH}"
          echo "UDID: ${IOS_DEVICE_UDID}"
          echo "Device: ${IOS_DEVICE_NAME}"
          echo "iOS: ${IOS_PLATFORM_VERSION}"
          echo ""
          
          npm run test:ios:ci
        env:
          IOS_APP_PATH: ./ios-app/DiiaOpenSource.app
          IOS_DEVICE_UDID: ${{ steps.boot-sim.outputs.udid }}
        timeout-minutes: 45

      # ======================================================================
      # КРОК 6: Артефакти (failure only)
      # ======================================================================

      - name: Upload screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots-${{ github.run_number }}
          path: artifacts/screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload page sources (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-pagesources-${{ github.run_number }}
          path: artifacts/pagesources/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ github.run_number }}
          path: ios-build/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload WDIO logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-wdio-logs-${{ github.run_number }}
          path: wdio-*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Simulator diagnostics (on failure)
        if: failure()
        run: |
          echo "=== Simulator List ==="
          xcrun simctl list devices || true
          echo ""
          echo "=== Booted Simulators ==="
          BOOTED=$(xcrun simctl list devices | grep "Booted" || true)
          if [ -z "$BOOTED" ]; then
            echo "⚠️  No booted simulators found"
          else
            echo "$BOOTED"
          fi

      # ======================================================================
      # КРОК 7: Job Summary
      # ======================================================================

      - name: Create job summary
        if: always()
        run: |
          echo "# iOS Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Configuration
          echo "## Configuration" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Device** | ${{ env.IOS_DEVICE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **iOS** | ${{ env.IOS_PLATFORM_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **App Tag** | ${{ env.IOS_APP_TAG }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bundle ID** | ${{ steps.verify-app.outputs.bundle_id || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **App Size** | ${{ steps.verify-app.outputs.app_size || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **UDID** | ${{ steps.boot-sim.outputs.udid || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Xcode
          echo "## Xcode Environment" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          xcodebuild -version >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Test Results
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.run-tests.outcome }}" == "success" ]; then
            echo "✅ **All tests passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Tests failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Artifacts uploaded:**" >> $GITHUB_STEP_SUMMARY
            echo "- Screenshots" >> $GITHUB_STEP_SUMMARY
            echo "- Page sources" >> $GITHUB_STEP_SUMMARY
            echo "- Build logs" >> $GITHUB_STEP_SUMMARY
            echo "- WDIO logs" >> $GITHUB_STEP_SUMMARY
          fi
